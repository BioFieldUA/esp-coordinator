name: GitHub Actions Build
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Enter the Firmware Version (e.g. v1.0.7.3)'
        required: true
        default: 'v1.0.0.0'
        type: string
permissions:
  contents: write
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - chip: esp32c5
            transport: usb
            antenna: ceramic
          - chip: esp32c5
            transport: uart
            antenna: ceramic
          - chip: esp32c6
            transport: usb
            antenna: ceramic
          - chip: esp32c6
            transport: usb
            antenna: external
          - chip: esp32c6
            transport: uart
            antenna: ceramic
          - chip: esp32c6
            transport: uart
            antenna: external
    steps:
    - name: Checkout repo
      uses: actions/checkout@v4
      with:
        submodules: 'recursive'
    - name: Install ESP-IDF
      uses: espressif/install-esp-idf-action@v1
      with:
        version: "v5.5.4"
    - name: Compile ESP-IDF project
      run: |
        idf.py -DSDKCONFIG_DEFAULTS="sdkconfig.${{ matrix.chip }};sdkconfig.${{ matrix.transport }};sdkconfig.${{ matrix.antenna }}" build
    - name: Generate OTA Update (.zigbee)
      run: |
        python build_ota.py
    - name: Merge Binaries into Factory Image
      run: |
        if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
          TAG_NAME="${{ inputs.version }}"
        else
          TAG_NAME="${{ github.event.release.tag_name }}"
        fi
        if [ "${{ matrix.chip }}" = "esp32c6" ]; then
          BOOT_OFFSET="0x0"
          BIN_NAME="esp-coordinator-esp32c6-${{ matrix.transport }}-${{ matrix.antenna }}-${TAG_NAME}"
        elif [ "${{ matrix.chip }}" = "esp32c5" ]; then
          BOOT_OFFSET="0x2000"
          BIN_NAME="esp-coordinator-esp32c5-${{ matrix.transport }}-${TAG_NAME}"
        else
          BOOT_OFFSET="0x0"
          BIN_NAME="esp-coordinator-${{ matrix.chip }}-${{ matrix.transport }}-${TAG_NAME}"
        fi
        esptool.py --chip ${{ matrix.chip }} --before=default_reset --after=hard_reset \
          merge_bin -o "${BIN_NAME}-factory.bin" \
          $BOOT_OFFSET build/bootloader/bootloader.bin \
          0x8000 build/partition_table/partition-table.bin \
          0x3d000 build/ota_data_initial.bin \
          0x3f000 build/phy_init_data.bin \
          0x40000 build/esp-coordinator.bin
        cp build/esp-coordinator.bin "${BIN_NAME}-update.bin"
    - name: Upload binaries to workspace artifacts
      uses: actions/upload-artifact@v4
      with:
        name: firmware-${{ matrix.chip }}-${{ matrix.transport }}-${{ matrix.antenna }}
        path: esp-coordinator-*.bin
    - name: Upload Release Assets
      uses: softprops/action-gh-release@v2
      if: github.event_name == 'release'
      with:
        files: |
          esp-coordinator-*.bin
          *.zigbee
  deploy-to-web:
    needs: build
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repo
      uses: actions/checkout@v4
    - name: Clear web folder
      run: |
        mkdir -p docs/firmware
        rm -rf docs/firmware/*
    - name: Download all workspace artifacts to web folder
      uses: actions/download-artifact@v4
      with:
        path: docs/firmware
        merge-multiple: true
    - name: Commit and Push to GitHub
      run: |
        git config --global user.name 'GitHub Actions Bot'
        git config --global user.email 'github-actions-bot@github.com'
        git add docs/firmware/
        git commit -m "Automated update of firmware binaries" || echo "No changes to commit"
        git push origin master
